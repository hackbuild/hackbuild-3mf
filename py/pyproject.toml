# PyPI package hackbuild_3mf (D-027). The modules are split from
# hackbuild-fab tools/py; the dependency pins equal tools/py/pyproject.toml
# there so both validators run on one numeric stack (D-040, D-140).
[project]
name = "hackbuild_3mf"
version = "0.1.0"
description = "Orca and Bambu dialect 3MF writer, validator and filament key harvester, from hackbuild-fab."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Moheeb Zara", email = "hackbuildvideo@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy==2.5.3",
  "trimesh==5.1.1",
  "manifold3d==3.5.4",
  # 2.5.0 ships no linux aarch64 wheel and no sdist; validate_3mf reports
  # the lib3mf rule not run where this marker drops it (D-153).
  "lib3mf==2.5.0; platform_machine != 'aarch64'",
]

[project.urls]
Repository = "https://github.com/hackbuild/hackbuild-3mf"

[project.scripts]
validate-3mf = "hackbuild_3mf.validate_3mf:cli"
orca3mf = "hackbuild_3mf.orca3mf:cli"
harvest-filament-keys = "hackbuild_3mf.harvest_filament_keys:cli"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbuild_3mf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
